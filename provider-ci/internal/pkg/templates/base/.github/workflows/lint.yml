# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumiverse/projen-pulumi-providers

name: lint

on:
  workflow_call:
    inputs: {}

env:
#{{ .Config | renderGlobalEnv | indent 2 }}#

jobs:
  lint:
    name: lint
    runs-on: #{{ .Config.Runner.Default }}#
    permissions:
      contents: read
    steps:
#{{- if .Config.FreeDiskSpaceBeforeTest }}#
    # Run as first step so we don't delete things that have just been installed
    - name: Free Disk Space (Ubuntu)
      uses: #{{ .Config.ActionVersions.FreeDiskSpace }}#
      with:
        tool-cache: false
        swap-storage: false
        dotnet: false
#{{- end }}#
    - name: Checkout Repo
      uses: #{{ .Config.ActionVersions.Checkout }}#
      with:
        #{{- if .Config.CheckoutSubmodules }}#
        submodules: #{{ .Config.CheckoutSubmodules }}#
        #{{- end }}#
        persist-credentials: false
#{{- if .Config.GitHubApp.Enabled }}#
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-auth
      with:
        app-id: ${{ secrets.PULUMI_PROVIDER_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.PULUMI_PROVIDER_AUTOMATION_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
#{{- end }}#
    - name: Install mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      env:
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
      with:
        version: #{{ .Config.MiseVersion }}#
        github_token: #{{ if .Config.GitHubApp.Enabled }}#${{ steps.app-auth.outputs.token }}#{{ else }}#${{ secrets.PULUMI_PROVIDER_AUTOMATION_TOKEN }}#{{ end }}#
        cache_save: false # A different job handles caching our tools.
    - name: disarm go:embed directives to enable lint
      continue-on-error: true # this fails if there are no go:embed directives
      run: |
        git grep -l 'go:embed' -- provider | xargs sed -i 's/go:embed/ goembed/g'
    - name: prepare workspace
      continue-on-error: true
      run: make prepare_local_workspace
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: golangci-lint
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
      with:
        install-mode: none # Handled by mise.
        working-directory: #{{ .Config.ModulePath }}#
